        // GAS HtmlService로 서빙된 환경인지 감지 (google.script.run 사용 가능 여부)

        // google.script.run 을 Promise 로 감싸는 헬퍼 (CORS 없는 네이티브 브리지)
        function gasRun(fnName) {
            const args = Array.prototype.slice.call(arguments, 1);
            return new Promise((resolve, reject) => {
                const runner = google.script.run
                    .withSuccessHandler(resolve)
                    .withFailureHandler(reject);
                runner[fnName].apply(runner, args);
            });
        }

        // ==========================================
        // 4. 메인 App 컴포넌트
        // ==========================================
        function App() {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [projects, setProjects] = useState([]);
            const [rentals, setRentals] = useState([]);
            const [kdt, setKdt] = useState([]);
            const [kdtMonthly, setKdtMonthly] = useState([]);
            const [monitoring, setMonitoring] = useState([]);
            const [targets, setTargets] = useState([]);
            const [deletedHistory, setDeletedHistory] = useState([]);
            
            const [mode, setMode] = useState('mock'); // 'mock' or 'api'
            const [apiUrl, setApiUrl] = useState('');
            const [isLoading, setIsLoading] = useState(false);
            const [errorMessage, setErrorMessage] = useState('');
            
            const [selectedYear, setSelectedYear] = useState(new Date().getFullYear());
            const [buildInfo, setBuildInfo] = useState(null); // 버전/업데이트일(스크립트 마지막 수정 기반)

            // 로컬 스토리지 또는 API에서 초기 설정값 불러오기
            useEffect(() => {
                const storedSettings = localStorage.getItem('bms_settings');
                let curMode = 'mock';
                let curUrl = '';
                
                if (storedSettings) {
                    const parsed = JSON.parse(storedSettings);
                    curMode = parsed.mode || 'mock';
                    curUrl = parsed.apiUrl || '';
                }

                // 구글 스프레드시트 웹앱으로 직접 실행된 경우 자동 연동 설정
                if (window.GAS_API_URL) {
                    curMode = 'api';
                    curUrl = window.GAS_API_URL;
                }

                setMode(curMode);
                setApiUrl(curUrl);
            }, []);

            // 모드와 API URL이 변경되면 로컬스토리지에 저장하고 데이터 로드
            useEffect(() => {
                localStorage.setItem('bms_settings', JSON.stringify({ mode, apiUrl }));
                loadData();
            }, [mode, apiUrl]);

            // 버전/업데이트일 1회 로드(스크립트 마지막 수정 기반, 자동)
            useEffect(() => {
                (async () => {
                    try { if (typeof isGasHosted === 'function' && isGasHosted()) setBuildInfo(await gasRun('apiBuildInfo')); }
                    catch (e) { /* 로컬/외부 모드는 상수 폴백 */ }
                })();
            }, []);

            // 데이터 로드 핵심 함수
            const loadData = async () => {
                setIsLoading(true);
                setErrorMessage('');
                
                if (mode === 'mock') {
                    // 로컬스토리지 초기화 체크
                    let mockProj = localStorage.getItem('bms_mock_projects');
                    let mockRent = localStorage.getItem('bms_mock_rentals');
                    let mockKdt = localStorage.getItem('bms_mock_kdt');
                    let mockTarg = localStorage.getItem('bms_mock_targets');
                    let mockDel = localStorage.getItem('bms_mock_deleted');

                    if (!mockProj) {
                        localStorage.setItem('bms_mock_projects', JSON.stringify(INITIAL_PROJECTS));
                        mockProj = JSON.stringify(INITIAL_PROJECTS);
                    }
                    if (!mockRent) {
                        localStorage.setItem('bms_mock_rentals', JSON.stringify(INITIAL_RENTALS));
                        mockRent = JSON.stringify(INITIAL_RENTALS);
                    }
                    if (!mockKdt) {
                        localStorage.setItem('bms_mock_kdt', JSON.stringify(INITIAL_KDT));
                        mockKdt = JSON.stringify(INITIAL_KDT);
                    }
                    if (!mockTarg) {
                        localStorage.setItem('bms_mock_targets', JSON.stringify(INITIAL_TARGETS));
                        mockTarg = JSON.stringify(INITIAL_TARGETS);
                    }
                    if (!mockDel) {
                        localStorage.setItem('bms_mock_deleted', JSON.stringify([]));
                        mockDel = JSON.stringify([]);
                    }

                    setProjects(JSON.parse(mockProj));
                    setRentals(JSON.parse(mockRent));
                    setKdt(JSON.parse(mockKdt));
                    setTargets(JSON.parse(mockTarg));
                    setDeletedHistory(JSON.parse(mockDel));
                    setIsLoading(false);
                } else {
                    // API 연동 모드
                    // (1) GAS HtmlService로 서빙된 경우: google.script.run 사용 (CORS 없음)
                    if (isGasHosted()) {
                        try {
                            const data = await gasRun('apiReadAll');
                            setProjects(data.projects || []);
                            setRentals(data.rentals || []);
                            setKdt(data.kdt || []);
                            setKdtMonthly(data.kdtMonthly || []);
                            setMonitoring(data.monitoring || []);
                            setTargets(data.targets || []);
                            setDeletedHistory(data.deletedHistory || []);
                        } catch (error) {
                            setErrorMessage(`데이터 로드 실패: ${(error && error.message) || error}`);
                        } finally {
                            setIsLoading(false);
                        }
                        return;
                    }

                    // (2) 외부 호스팅 등: fetch 폴백
                    if (!apiUrl) {
                        setErrorMessage('Google Apps Script Web App URL을 설정해 주세요.');
                        setIsLoading(false);
                        return;
                    }

                    try {
                        const response = await fetch(`${apiUrl}?action=readAll`);
                        const result = await response.json();
                        if (result.status === 'success') {
                            setProjects(result.data.projects || []);
                            setRentals(result.data.rentals || []);
                            setKdt(result.data.kdt || []);
                            setKdtMonthly(result.data.kdtMonthly || []);
                            setMonitoring(result.data.monitoring || []);
                            setTargets(result.data.targets || []);
                            setDeletedHistory(result.data.deletedHistory || []);
                        } else {
                            setErrorMessage(result.message || '데이터를 불러오지 못했습니다.');
                        }
                    } catch (error) {
                        setErrorMessage(`API 연결 실패: ${error.toString()}`);
                    } finally {
                        setIsLoading(false);
                    }
                }
            };

            // 데이터 조작 처리 통합 공통 함수 (추가/수정/삭제)
            const executeAction = async (actionName, payload) => {
                setIsLoading(true);
                setErrorMessage('');
                
                if (mode === 'mock') {
                    // Mock 데이터 갱신 및 로컬스토리지 저장
                    try {
                        let curProjects = [...projects];
                        let curRentals = [...rentals];
                        let curKdt = [...kdt];
                        let curDeleted = [...deletedHistory];

                        const nowStr = formatDate(new Date()) + " " + new Date().toTimeString().split(' ')[0];

                        if (actionName === 'addProject') {
                            curProjects.push({ ...payload, comments: payload.comments || "" });
                        } else if (actionName === 'updateProject') {
                            curProjects = curProjects.map(p => p.name === payload.name ? { ...p, ...payload } : p);
                        } else if (actionName === 'deleteProject') {
                            const target = curProjects.find(p => p.name === payload.name);
                            if (target) {
                                curDeleted.push({
                                    deletedAt: nowStr,
                                    originalSheet: "전체 사업",
                                    keyIdentifier: target.name,
                                    summary: `유형: ${target.type}, 매출: ${formatKRW(target.sales)}, 단계: ${target.stage}`
                                });
                                curProjects = curProjects.filter(p => p.name !== payload.name);
                            }
                        } else if (actionName === 'addRental') {
                            const newId = 'RES-' + Date.now();
                            curRentals.push({ ...payload, id: newId });
                        } else if (actionName === 'updateRental') {
                            curRentals = curRentals.map(r => r.id === payload.id ? { ...r, ...payload } : r);
                        } else if (actionName === 'deleteRental') {
                            const target = curRentals.find(r => r.id === payload.id);
                            if (target) {
                                curDeleted.push({
                                    deletedAt: nowStr,
                                    originalSheet: "대관사업",
                                    keyIdentifier: target.id,
                                    summary: `행사명: ${target.title}, 대관료: ${formatKRW(target.sales)}, 시작일: ${target.startDate}`
                                });
                                curRentals = curRentals.filter(r => r.id !== payload.id);
                            }
                        } else if (actionName === 'addKdt') {
                            const newId = 'KDT-' + Date.now();
                            curKdt.push({ ...payload, id: newId });
                        } else if (actionName === 'updateKdt') {
                            curKdt = curKdt.map(k => k.id === payload.id ? { ...k, ...payload } : k);
                        } else if (actionName === 'deleteKdt') {
                            const target = curKdt.find(k => k.id === payload.id);
                            if (target) {
                                curDeleted.push({
                                    deletedAt: nowStr,
                                    originalSheet: "KDT",
                                    keyIdentifier: target.courseName,
                                    summary: `매출: ${formatKRW(target.sales)}`
                                });
                                curKdt = curKdt.filter(k => k.id !== payload.id);
                            }
                        }

                        // 로컬 저장소 세팅
                        localStorage.setItem('bms_mock_projects', JSON.stringify(curProjects));
                        localStorage.setItem('bms_mock_rentals', JSON.stringify(curRentals));
                        localStorage.setItem('bms_mock_kdt', JSON.stringify(curKdt));
                        localStorage.setItem('bms_mock_deleted', JSON.stringify(curDeleted));

                        // 상태 업데이트
                        setProjects(curProjects);
                        setRentals(curRentals);
                        setKdt(curKdt);
                        setDeletedHistory(curDeleted);
                    } catch (e) {
                        setErrorMessage(`Mock 처리 에러: ${e.toString()}`);
                    } finally {
                        setIsLoading(false);
                    }
                } else {
                    // API 연동 모드
                    // (1) GAS HtmlService로 서빙된 경우: google.script.run 사용 (CORS 없음)
                    if (isGasHosted()) {
                        try {
                            await gasRun('apiExecute', actionName, payload);
                            await loadData(); // 최신 데이터 리로드
                        } catch (error) {
                            setErrorMessage(`요청 실패: ${(error && error.message) || error}`);
                            setIsLoading(false);
                        }
                        return;
                    }

                    // (2) 외부 호스팅 등: fetch 폴백 (POST)
                    try {
                        const response = await fetch(apiUrl, {
                            method: 'POST',
                            mode: 'cors',
                            headers: { 'Content-Type': 'text/plain' }, // GAS의 CORS 정책 우회를 위해 text/plain 권장
                            body: JSON.stringify({ action: actionName, payload })
                        });
                        const result = await response.json();
                        if (result.status === 'success') {
                            await loadData(); // 최신 데이터 리로드
                        } else {
                            setErrorMessage(result.message || '요청이 실패하였습니다.');
                            setIsLoading(false);
                        }
                    } catch (error) {
                        setErrorMessage(`API 통신 에러: ${error.toString()}`);
                        setIsLoading(false);
                    }
                }
            };

            return (
                <div className="flex flex-col min-h-screen">
                    {/* 상단 네비게이션 */}

                                    { id: 'settings', name: '시스템 설정', icon: 'settings' }

                            <div className="pt-4 border-t border-slate-200 text-xs text-slate-400">

                                            <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                                            <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>

                        {/* 중앙 스크롤 메인 판넬 */}
                        <main className="flex-1 overflow-y-auto p-8">
                            {errorMessage && (
                                <div className="mb-6 p-4 bg-rose-500/10 border border-rose-500/20 text-rose-600 rounded-xl flex items-start space-x-3">
                                    <Icon name="warning" className="w-5 h-5 mt-0.5 flex-shrink-0" />
                                    <div>
                                        <p className="font-bold text-sm">시스템 안내</p>
                                        <p className="text-xs text-rose-600">{errorMessage}</p>
                                    </div>
                                </div>
                            )}

                            {/* 탭 렌더링 분기 */}
                            <ErrorBoundary key={activeTab}>
                            {activeTab === 'dashboard' && (
                                <Dashboard 
                                    kdtMonthly={kdtMonthly}
                                    monitoring={monitoring}
                                    projects={projects} 
                                    rentals={rentals} 
                                    kdt={kdt} 
                                    targets={targets} 
                                    selectedYear={selectedYear} 
                                    formatKRW={formatKRW}
                                />
                            )}
                            {activeTab === 'projects' && (
                                <ProjectManagement 
                                    projects={projects} 
                                    executeAction={executeAction}
                                    formatKRW={formatKRW}
                                    selectedYear={selectedYear}
                                />
                            )}
                            {activeTab === 'rentals' && (
                                <RentalManagement 
                                    rentals={rentals} 
                                    executeAction={executeAction}
                                    formatKRW={formatKRW}
                                />
                            )}
                            {activeTab === 'kdt' && (
                                <KdtManagement 
                                    kdtMonthly={kdtMonthly}
                                    formatKRW={formatKRW}
                                />
                            )}
                            {activeTab === 'monitoring' && (
                                <MonitoringManagement 
                                    formatKRW={formatKRW}
                                    loadData={loadData}
                                    mode={mode}
                                    projects={projects}
                                    executeAction={executeAction}
                                />
                            )}
                            {activeTab === 'settings' && (
                                <Settings 
                                    mode={mode} 
                                    setMode={setMode} 
                                    apiUrl={apiUrl} 
                                    setApiUrl={setApiUrl} 
                                    deletedHistory={deletedHistory}
                                    loadData={loadData}
                                />
                            )}
                            </ErrorBoundary>
                        </main>
                    </div>
                    <footer className="border-t border-slate-200 bg-white/70 backdrop-blur px-8 py-3.5 flex items-center justify-between text-[11px] text-slate-400 flex-wrap gap-2">
                        <span className="flex items-center gap-2">
                            <span className="font-semibold text-slate-500">BMS · AX 사업본부</span>
                            <span className="text-slate-300">·</span>
                            <span>v{(buildInfo && buildInfo.version) || APP_VERSION}</span>
                            <span className="text-slate-300">·</span>
                            <span>업데이트 {(buildInfo && buildInfo.updated) || APP_UPDATED}</span>
                        </span>
                        <span className="flex items-center gap-1.5">
                            <span className="text-slate-400">made by</span>
                            <span className="font-extrabold tracking-wide bg-gradient-to-r from-brand-600 via-indigo-500 to-sky-500 bg-clip-text text-transparent">김부용</span>
                        </span>
                    </footer>
                </div>
            );
        } 

        // ==========================================
        // 5. 대시보드 화면 컴포넌트
        // ==========================================
        function Dashboard({ projects, rentals, kdt, kdtMonthly, monitoring, targets, selectedYear, formatKRW }) {
            
            // 2026년 이전 데이터 소실 경고 여부
            const showWarning = selectedYear < 2026;

            // 대시보드 소스별 보기 토글 상태 (all / project / rental / kdt)
            const [viewFilter, setViewFilter] = useState('all');
            // 달성도에 예상매출(향후 월) 포함 여부
            const [includeExpected, setIncludeExpected] = useState(true);

            // 1. 매출 계산
            // - 제안 사업: G열(단계)이 '수주' 상태인 것만 매출 집계
            // - 매출 = D열(sales) 우선, 없으면 (지분율% / 100) * 사업비
            const processedProjects = useMemo(() => {
                return projects.map(p => {
                    const parsedPeriod = parsePeriodRange(p.periodText);
                    const calculatedSales = Number(p.sales) || Math.round(((Number(p.shareRatio) || 0) / 100) * (p.cost || 0));
                    
                    return {
                        ...p,
                        calculatedSales,
                        parsedPeriod,    // 파싱된 기간 정보 ({start, end, isValid, durationMonths})
                    };
                });
            }, [projects]);

            // 연도별 및 월별 매출 분석
            const monthlyStats = useMemo(() => {
                // 12개월 배열 생성 (0: 1월 ~ 11: 12월)
                const stats = Array.from({ length: 12 }, (_, i) => ({
                    month: `${i + 1}월`,
                    projectSales: 0,
                    rentalSales: 0,
                    kdtSales: 0,
                    kdtEstimate: 0,
                    kdtCats: {}, // 분류별(딥다이브/카테부/케클업) 월 금액
                    totalSales: 0,
                    projectItems: [] // 해당 월 제안사업 매출의 사업명별 내역 [{name, client, amount}]
                }));

                let projectTotal = 0;
                let rentalTotal = 0;
                let kdtTotal = 0;
                let kdtEstimateTotal = 0;
                const projectByType = {}; // 유형별(B2G/B2B/B2C/글로벌) 수주 매출

                // 1) 제안 사업 매출 배분 (매출 = D열 = 이미 지분율 반영된 값)
                processedProjects.forEach(p => {
                    if (normalizeStage(p.stage) !== '수주') return; // 수주 건만 집계
                    const rev = p.calculatedSales;
                    if (!rev) return;
                    const ptype = p.type || '기타';
                    const addType = (amt) => { projectByType[ptype] = (projectByType[ptype] || 0) + amt; };

                    if (p.parsedPeriod.isValid) {
                        // 용역 기간이 명확하면 기간(월)으로 분할 배분
                        const start = p.parsedPeriod.start;
                        const end = p.parsedPeriod.end;
                        const monthlyAlloc = getMonthlyAllocation(rev, p.parsedPeriod.durationMonths);
                        for (let m = 0; m < 12; m++) {
                            const checkDate = new Date(selectedYear, m, 15); // 월 중간 날짜로 비교 안전성 도모
                            if (isDateInRange(checkDate, start, end)) {
                                stats[m].projectSales += monthlyAlloc;
                                stats[m].projectItems.push({ name: p.name, client: p.client, amount: monthlyAlloc });
                                projectTotal += monthlyAlloc;
                                addType(monthlyAlloc);
                            }
                        }
                    } else {
                        // 기간 미상 → 제안시기(proposalPeriod) 연/월에 전액 귀속 (연도 필터 보존, 매출 유실 방지)
                        const py = extractYear(p.proposalPeriod);
                        const pd = parseDateString(p.proposalPeriod);
                        const month = pd ? pd.getMonth() : 0; // 월 정보 없으면 1월로 귀속
                        if (py === selectedYear) {
                            stats[month].projectSales += rev;
                            stats[month].projectItems.push({ name: p.name, client: p.client, amount: rev });
                            projectTotal += rev;
                            addType(rev);
                        }
                    }
                });

                // 2) 대관사업 매출 배분
                // - 시작일(B열) 기준으로 연도/월 대칭 배분
                rentals.forEach(r => {
                    if (r.status !== '확정') return; // 확정된 대관만
                    const date = parseDateString(r.startDate);
                    if (date && date.getFullYear() === selectedYear) {
                        const m = date.getMonth();
                        stats[m].rentalSales += (r.sales || 0);
                        rentalTotal += (r.sales || 0);
                    }
                });

                // 3) KDT 매출 배분 (신 구조: { total, categories[] }) — splitKdtMonthly 사용
                const _now = new Date();
                const _curY = _now.getFullYear();
                const k = splitKdtMonthly(kdtMonthly);
                const kdtCatNames = (k.categories || []).map(c => c.name);
                if (k.monthly.some(v => v > 0) || (k.categories || []).length) {
                    if (selectedYear === _curY) {
                        k.rows.forEach((r, m) => {
                            if (r.kind === 'actual') { stats[m].kdtSales += r.amount; kdtTotal += r.amount; }
                            else { stats[m].kdtEstimate += r.amount; kdtEstimateTotal += r.amount; }
                        });
                    } else if (selectedYear < _curY) {
                        k.monthly.forEach((amt, m) => { stats[m].kdtSales += amt; kdtTotal += amt; });
                    }
                    // 분류별 월 금액 기록(연도 무관, 차트용)
                    if (selectedYear === _curY || selectedYear < _curY) {
                        (k.categories || []).forEach(c => c.monthly.forEach((amt, m) => {
                            stats[m].kdtCats[c.name] = (stats[m].kdtCats[c.name] || 0) + amt;
                        }));
                    }
                }

                // 총합 계산 + 사업명 내역 정리(동일 사업명 합산 후 금액 내림차순)
                stats.forEach(s => {
                    s.totalSales = s.projectSales + s.rentalSales + s.kdtSales + s.kdtEstimate;
                    if (s.projectItems.length > 1) {
                        const merged = {};
                        s.projectItems.forEach(it => {
                            const key = it.name + '\u0001' + (it.client || '');
                            if (!merged[key]) merged[key] = { name: it.name, client: it.client, amount: 0 };
                            merged[key].amount += it.amount;
                        });
                        s.projectItems = Object.keys(merged).map(k => merged[k]).sort((a, b) => b.amount - a.amount);
                    }
                });

                return {
                    months: stats,
                    kdtCatNames,
                    projectTotal,
                    projectByType,
                    rentalTotal,
                    kdtTotal,
                    kdtEstimateTotal,
                    // 종합 집계 = 전체 연도(예상 포함): 제안+대관(연중 전체) + KDT(발생+예상)
                    grandTotal: projectTotal + rentalTotal + kdtTotal + kdtEstimateTotal
                };
            }, [processedProjects, rentals, kdt, kdtMonthly, selectedYear]);

            // 제안 예상 매출 (파이프라인) — 중복 없이
            //  (A) 제안 사업 진행단계: 제안 중 · 결과 대기 중 (미결정)
            //  (B) 모니터링 미등록: 공고예정(수기입력) · 최종검토완료 & 판정≠'작업 진행'
            const projEstimate = useMemo(() => {
                const isCurY = selectedYear === new Date().getFullYear();
                const norm = (s) => String(s == null ? '' : s).replace(/\s+/g, '').toLowerCase();
                const monthly = Array(12).fill(0); // 제안 예상 월별 배분
                const monthlyItems = Array.from({ length: 12 }, () => []); // 월별 사업명 내역
                const curMo = new Date().getMonth();
                // 제안 사업 인덱스: 사업명 → {stage, sales}
                const projByName = {};
                processedProjects.forEach(p => {
                    projByName[norm(p.name)] = { stage: normalizeStage(p.stage), sales: Number(p.calculatedSales) || 0 };
                });
                // (B) 제안 사업 파이프라인: 제안 중 · 결과 대기 중 → 제안시기 월
                let pipeline = 0;
                processedProjects.forEach(p => {
                    const st = normalizeStage(p.stage);
                    if (st === '제안 중' || st === '결과 대기 중') {
                        const py = extractYear(p.proposalPeriod);
                        if (py === selectedYear || !py) {
                            const amt = Number(p.calculatedSales) || 0;
                            pipeline += amt;
                            const pd = parseDateString(p.proposalPeriod);
                            const mo = pd ? pd.getMonth() : curMo;
                            monthly[mo] += amt;
                            monthlyItems[mo].push({ name: p.name || '(제목없음)', amount: amt });
                        }
                    }
                });
                // (A) 모니터링 금액(예산): 공고예정(수기입력) · 최종검토완료 → 마감일 월
                let moni = 0;
                if (isCurY) {
                    (monitoring || []).forEach(row => {
                        const status = String(row['상태'] || '');
                        const isPre = status.indexOf('공고예정') >= 0 || status.indexOf('최종 검토 완료') >= 0 || status.indexOf('최종검토') >= 0;
                        if (!isPre) return;
                        if (status.indexOf('제외') >= 0) return;
                        const linked = projByName[norm(row['사업명'])];
                        if (linked) {
                            if (linked.stage === '수주' || linked.stage === '실주') return; // 결정됨 → 예상 제외
                            if (linked.sales > 0) return; // 제안 사업 매출로 이미 집계 → 중복 방지
                        }
                        const amt = parseFloat(String(row['예산'] == null ? '' : row['예산']).replace(/[^\d.-]/g, '')) || 0;
                        moni += amt;
                        const dm = String(row['마감일'] || '').match(/(\d{4})[.\-\/]\s*(\d{1,2})/);
                        const mo = dm ? Math.min(11, Math.max(0, (+dm[2]) - 1)) : curMo;
                        monthly[mo] += amt;
                        monthlyItems[mo].push({ name: row['사업명'] || '(제목없음)', amount: amt });
                    });
                }
                return { pipeline, monitoring: moni, total: pipeline + moni, monthly, monthlyItems };
            }, [processedProjects, monitoring, selectedYear]);

            // 연도별 목표액 및 달성률 (예상 포함 / 현재시점)
            //  - 발생: 제안(수주)+대관+KDT발생  |  예상: + KDT예상 + 제안예상(파이프라인)
            const targetInfo = useMemo(() => {
                const matched = targets.find(t => t.year === selectedYear);
                const targetValue = matched ? matched.target : 0;
                const P = monthlyStats.projectTotal;          // 제안(수주)
                const R = monthlyStats.rentalTotal;           // 대관
                const Kact = monthlyStats.kdtTotal;           // KDT 발생
                const Kexp = monthlyStats.kdtEstimateTotal;   // KDT 예상
                const PE = projEstimate.total;                // 제안 예상(파이프라인)

                const currentTotal = P + R + Kact;            // 현재 발생
                const fullYearTotal = P + R + Kact + Kexp + PE; // 예상 포함
                const pct = (amt) => targetValue > 0 ? Math.round((amt / targetValue) * 100) : 0;
                const achieved = includeExpected ? fullYearTotal : currentTotal;

                // 달성액 소스별 구성 (KDT·제안은 토글에 따라 예상 가감)
                const kdtForMode = includeExpected ? (Kact + Kexp) : Kact;
                const projForMode = includeExpected ? (P + PE) : P;
                const srcTotal = projForMode + R + kdtForMode;
                const ratio = (v) => srcTotal > 0 ? Math.round((v / srcTotal) * 10000) / 100 : 0; // 소수2자리 %
                const breakdown = [
                    { label: '제안 사업', amount: projForMode, ratio: ratio(projForMode), color: 'bg-violet-500', text: 'text-violet-600' },
                    { label: '대관사업', amount: R, ratio: ratio(R), color: 'bg-cyan-500', text: 'text-cyan-600' },
                    { label: 'KDT', amount: kdtForMode, ratio: ratio(kdtForMode), color: 'bg-amber-500', text: 'text-amber-600' }
                ];

                return {
                    targetValue,
                    fullYearTotal, currentTotal,
                    percentFull: pct(fullYearTotal),
                    percentCurrent: pct(currentTotal),
                    achieved,
                    percent: pct(achieved),
                    breakdown, srcTotal
                };
            }, [targets, selectedYear, monthlyStats, includeExpected, projEstimate]);

            // 제안 결정 대기(모니터링 상태=1차 검토 완료) 건수 — '검토 중'에 합산. 캐시 우선.
            const [pendingCount, setPendingCount] = useState(0);
            useEffect(() => {
                if (typeof isGasHosted !== 'function' || !isGasHosted()) return;
                if (Array.isArray(window.__pendingCache)) { setPendingCount(window.__pendingCache.length); return; }
                (async () => {
                    try { const list = await gasRun('apiReadPendingDecisions'); const arr = Array.isArray(list) ? list : []; window.__pendingCache = arr; setPendingCount(arr.length); }
                    catch (e) { /* 실패 시 0 */ }
                })();
            }, []);

            // 수주 현황 및 통계 데이터 (제안 사업 단계별 건수)
            const stageCounts = useMemo(() => {
                const counts = { "검토 중": 0, "제안 중": 0, "결과 대기 중": 0, "중단": 0, "수주": 0, "실주": 0 };
                let total = 0;
                
                projects.forEach(p => {
                    const py = extractYear(p.proposalPeriod);
                    // 제안시기가 선택 연도에 포함되는 경우 카운트
                    if (py === selectedYear) {
                        const st = normalizeStage(p.stage);
                        if (counts[st] !== undefined) {
                            counts[st]++;
                        }
                        total++;
                    }
                });
                
                return { ...counts, total };
            }, [projects, selectedYear]);

            // 소스별 보기 토글에 따른 표시 여부
            const showProject = viewFilter === 'all' || viewFilter === 'project';
            const showRental  = viewFilter === 'all' || viewFilter === 'rental';
            const showKdt     = viewFilter === 'all' || viewFilter === 'kdt';

            // 토글 선택에 맞춰 월별 표시 데이터 재구성
            const KDT_COLORS = { '딥다이브': '#d97706', '카테부': '#f59e0b', '케클업': '#fbbf24' };
            const kdtCatNames = monthlyStats.kdtCatNames || [];
            const _curYear = new Date().getFullYear();
            const _curMonth = new Date().getMonth();
            const monthsView = monthlyStats.months.map((m, idx) => {
                const vProject = showProject ? m.projectSales : 0;
                const vProjEst = showProject ? (projEstimate.monthly[idx] || 0) : 0;
                const vProjEstItems = showProject ? (projEstimate.monthlyItems[idx] || []) : [];
                const vRental  = showRental ? m.rentalSales : 0;
                // KDT 분류별 금액 + 이 달이 예상(미래월)인지
                const kdtExpected = (selectedYear === _curYear) && (idx > _curMonth);
                const vKdtCats = {}; let vKdtTotal = 0;
                if (showKdt) kdtCatNames.forEach(n => { const a = (m.kdtCats && m.kdtCats[n]) || 0; vKdtCats[n] = a; vKdtTotal += a; });
                return { ...m, vProject, vProjEst, vProjEstItems, vRental, vKdtCats, vKdtTotal, kdtExpected, vTotal: vProject + vProjEst + vRental + vKdtTotal };
            });

            // 현재 보기 합계 및 차트 최대값(현재 보기 기준)
            const viewTotal = monthsView.reduce((s, m) => s + m.vTotal, 0);
            const rawMax = Math.max(...monthsView.map(m => m.vTotal), 10000000); // 최소 1천만
            const axisStep = niceStep(rawMax / 4); // 약 4구간이 되도록 깔끔한 step
            const maxMonthSales = Math.ceil(rawMax / axisStep) * axisStep; // 깔끔한 상한(막대 여백 확보)
            const axisTicks = [];
            for (let v = maxMonthSales; v >= 0; v -= axisStep) axisTicks.push(v);

            return (
                <div className="space-y-8 animate-fadeIn">
                    
                    {/* 데이터 소실 경고창 */}
                    {showWarning && (
                        <div className="p-5 bg-amber-500/10 border border-amber-500/20 text-amber-600 rounded-2xl flex items-start space-x-4 shadow-xl shadow-amber-950/20">

        function RentalManagement({ rentals, executeAction, formatKRW }) {
            const [isFormOpen, setIsFormOpen] = useState(false);
            const [currentRental, setCurrentRental] = useState(null);

            // 필터/검색/정렬 상태
            const RENTAL_LOCATIONS = ['MESSI 1', 'MESSI 2', 'MESSI 3', 'RONALDO 1', 'RONALDO 2', 'TOWN HALL', 'SONNY 1', 'JISUNG 1', 'JISUNG 2', 'PEP 1', 'SONNY 2', 'PEP 2', 'PEP 3'];
            const [statusFilter, setStatusFilter] = useState('All');
            const [locationFilter, setLocationFilter] = useState('All');
            const [searchTerm, setSearchTerm] = useState('');
            const [viewMode, setViewMode] = useState('calendar'); // 기본: 캘린더
            const [calRef, setCalRef] = useState(() => { const d = new Date(); return { y: d.getFullYear(), m: d.getMonth() }; });
            // 장소 필드는 'JISUNG 1, JISUNG 2'처럼 복수일 수 있어 콤마로 파싱
            const parseLocations = (loc) => String(loc || '').split(',').map(s => s.trim()).filter(Boolean);
            const sort = useSortable('startDate', 'desc');
            const rentalSortTypes = {
                id: 'string', title: 'string', startDate: 'date',
                location: 'string', manager: 'string', status: 'string', sales: 'number'
            };

            const filteredRentals = useMemo(() => {
                return rentals.filter(r => {
                    if (statusFilter !== 'All' && r.status !== statusFilter) return false;
                    if (locationFilter !== 'All' && String(r.location || '').indexOf(locationFilter) === -1) return false;
                    if (searchTerm) {
                        const t = searchTerm.toLowerCase();
                        return [r.title, r.manager, r.location, r.id].some(v => String(v || '').toLowerCase().includes(t));
                    }
                    return true;
                });
            }, [rentals, statusFilter, locationFilter, searchTerm]);

            const sortedRentals = useMemo(
                () => applySort(filteredRentals, sort.sortKey, sort.sortDir, rentalSortTypes),
                [filteredRentals, sort.sortKey, sort.sortDir]
            );

            // 캘린더 데이터: 해당 월 셀 + 일자별 대관 이벤트(다일 행사는 기간 내 모든 날에 표시)
            const pad2 = (n) => String(n).padStart(2, '0');
            const fmtYmd = (dt) => `${dt.getFullYear()}-${pad2(dt.getMonth() + 1)}-${pad2(dt.getDate())}`;
            const calData = useMemo(() => {
                const { y, m } = calRef;
                const startDow = new Date(y, m, 1).getDay();
                const daysInMonth = new Date(y, m + 1, 0).getDate();
                const cells = [];
                for (let i = 0; i < startDow; i++) cells.push(null);
                for (let d = 1; d <= daysInMonth; d++) cells.push(new Date(y, m, d));
                while (cells.length % 7 !== 0) cells.push(null);
                const evByDay = {};
                filteredRentals.forEach(r => {
                    if (!r.startDate) return;
                    const s = r.startDate, e = r.endDate || r.startDate;
                    cells.forEach(c => { if (!c) return; const ds = fmtYmd(c); if (ds >= s && ds <= e) { (evByDay[ds] = evByDay[ds] || []).push(r); } });
                });
                return { cells, evByDay, y, m };
            }, [calRef, filteredRentals]);
            const moveMonth = (delta) => setCalRef(p => { const d = new Date(p.y, p.m + delta, 1); return { y: d.getFullYear(), m: d.getMonth() }; });
            const todayYmd = fmtYmd(new Date());

            // 폼 상태

        // ==========================================
        // 8. KDT 관리 CRUD 화면 컴포넌트
        // ==========================================
        function KdtManagement({ kdtMonthly, formatKRW }) {
            const k = splitKdtMonthly(kdtMonthly);
            const rows = k.rows;
            const cats = k.categories || [];
            const curM = k.curM;
            const actualTotal = k.actualTotal;
            const expectedTotal = k.expectedTotal;
            const grandTotal = k.grandTotal;
            const maxAmt = rows.reduce((m, r) => Math.max(m, r.amount), 1);
            const hasData = grandTotal > 0;
            const KDT_COLORS = { '딥다이브': '#d97706', '카테부': '#f59e0b', '케클업': '#fbbf24' };
            const hatch = 'repeating-linear-gradient(45deg, rgba(255,255,255,0.65) 0, rgba(255,255,255,0.65) 3px, transparent 3px, transparent 7px)';

            // 예상값 변동 추적 리포트
            const [kdtReport, setKdtReport] = useState(null);
            const [snapBusy, setSnapBusy] = useState(false);
            const [snapMsg, setSnapMsg] = useState('');
            const loadReport = async () => {
                try { if (typeof isGasHosted === 'function' && isGasHosted()) setKdtReport(await gasRun('apiKdtChangeReport')); } catch (e) { /* 로컬모드 무시 */ }
            };
            useEffect(() => { loadReport(); }, []);
            const takeSnapshot = async () => {
                setSnapBusy(true); setSnapMsg('스냅샷 저장 중…');
                try { const r = await gasRun('apiKdtSnapshot'); setSnapMsg(r || '완료'); await loadReport(); }
                catch (e) { setSnapMsg('실패: ' + ((e && e.message) || e)); }
                setSnapBusy(false);
            };
            const realized = (kdtReport && kdtReport.months || []).filter(m => m && m.realizedDiff !== null && m.realizedDiff !== undefined && m.lastExpected && m.firstActual);
            const expChanges = (kdtReport && kdtReport.months || []).map(m => {
                const exp = ((m && m.series) || []).filter(s => s && s.kind === '예상' && typeof s.amt === 'number');
                return { month: m.month, exp };
            }).filter(m => m.exp.length >= 2); // 예상 스냅샷이 2회 이상이어야 변동 표시

            return (
                <div className="space-y-6 animate-fadeIn">
                    <div>
                        <h2 className="text-3xl font-extrabold text-slate-900">KDT (K-Digital Training) 관리</h2>
                        <p className="text-sm text-slate-500">딥다이브 · 카테부 · 케클업 분류별 월 매출 · 현재 월까지는 발생, 이후는 예상</p>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">

                        <div className="grid grid-cols-2 gap-2">
                            <label className="block col-span-2"><span className="text-[11px] text-slate-400">사업명</span>
                                <input value={pdetail.name || ''} onChange={e => pField('name', e.target.value)} className="w-full mt-0.5 bg-slate-50 border border-slate-200 rounded-lg px-2 py-1.5 text-sm focus:outline-none focus:border-brand-500" /></label>
                            <label className="block"><span className="text-[11px] text-slate-400">발주처</span>
                                <input value={pdetail.client || ''} onChange={e => pField('client', e.target.value)} className="w-full mt-0.5 bg-slate-50 border border-slate-200 rounded-lg px-2 py-1.5 text-sm focus:outline-none focus:border-brand-500" /></label>
                            <label className="block"><span className="text-[11px] text-slate-400">단계</span>
                                <select value={normalizeStage(pdetail.stage)} onChange={e => pField('stage', e.target.value)} className="w-full mt-0.5 bg-slate-50 border border-slate-200 rounded-lg px-2 py-1.5 text-sm focus:outline-none focus:border-brand-500">
                                    {['제안 중', '결과 대기', '수주', '실주'].map(s => <option key={s} value={s}>{s}</option>)}
                                </select></label>
                            <label className="block"><span className="text-[11px] text-slate-400">사업비(원)</span>
                                <input type="number" value={pdetail.cost || 0} onChange={e => pField('cost', Number(e.target.value) || 0)} className="w-full mt-0.5 bg-slate-50 border border-slate-200 rounded-lg px-2 py-1.5 text-sm focus:outline-none focus:border-brand-500" /></label>
                            <label className="block"><span className="text-[11px] text-slate-400">참여 형태</span>
                                <select value={pdetail.participation || '단독'} onChange={e => pField('participation', e.target.value)} className="w-full mt-0.5 bg-slate-50 border border-slate-200 rounded-lg px-2 py-1.5 text-sm focus:outline-none focus:border-brand-500">
                                    {['단독', '컨소시엄'].map(s => <option key={s} value={s}>{s}</option>)}
                                </select></label>
                            <label className="block"><span className="text-[11px] text-slate-400">지분(%)</span>
                                <input type="number" value={pdetail.shareRatio != null ? pdetail.shareRatio : 100} onChange={e => pField('shareRatio', Number(e.target.value) || 0)} className="w-full mt-0.5 bg-slate-50 border border-slate-200 rounded-lg px-2 py-1.5 text-sm focus:outline-none focus:border-brand-500" /></label>
                            <label className="block"><span className="text-[11px] text-slate-400">컨소시엄</span>
                                <input value={pdetail.consortium || ''} onChange={e => pField('consortium', e.target.value)} className="w-full mt-0.5 bg-slate-50 border border-slate-200 rounded-lg px-2 py-1.5 text-sm focus:outline-none focus:border-brand-500" /></label>
                            <label className="block"><span className="text-[11px] text-slate-400">제안 담당</span>
                                <input value={pdetail.managers || ''} onChange={e => pField('managers', e.target.value)} className="w-full mt-0.5 bg-slate-50 border border-slate-200 rounded-lg px-2 py-1.5 text-sm focus:outline-none focus:border-brand-500" /></label>
                            <label className="block"><span className="text-[11px] text-slate-400">제출마감</span>
                                <input type="date" value={onlyDate(pdetail.dueDate)} onChange={e => pField('dueDate', e.target.value)} className="w-full mt-0.5 bg-slate-50 border border-slate-200 rounded-lg px-2 py-1.5 text-sm focus:outline-none focus:border-brand-500" /></label>
                            <label className="block"><span className="text-[11px] text-slate-400">발표일</span>
                                <input type="date" value={onlyDate(pdetail.presentDate)} onChange={e => pField('presentDate', e.target.value)} className="w-full mt-0.5 bg-slate-50 border border-slate-200 rounded-lg px-2 py-1.5 text-sm focus:outline-none focus:border-brand-500" /></label>
                            <label className="block"><span className="text-[11px] text-slate-400">우선순위</span>
                                <select value={String(Number(pdetail.priority) || 2)} onChange={e => pField('priority', Number(e.target.value))} className="w-full mt-0.5 bg-slate-50 border border-slate-200 rounded-lg px-2 py-1.5 text-sm focus:outline-none focus:border-brand-500">
                                    <option value="3">높음</option><option value="2">보통</option><option value="1">낮음</option>
                                </select></label>
                        </div>
                        {pdetail.folderUrl && <a href={pdetail.folderUrl} target="_blank" rel="noreferrer" className="text-xs text-brand-600 underline">📁 폴더 바로가기 ↗</a>}
                    </div>
                </div>
                <div className="shrink-0 pt-4 pb-6 px-4 border-t border-slate-100 flex gap-2">
                    <button onClick={() => setPdetail(null)} className="flex-1 py-2 rounded-lg text-xs font-bold text-slate-500 border border-slate-200">취소</button>
                    <button onClick={saveProject} disabled={psaving} className="flex-1 bg-brand-600 text-white py-2 rounded-lg text-xs font-bold disabled:opacity-50">{psaving ? '저장 중…' : '저장'}</button>
                </div>
            </>;
        }

        function ProgressBoard({ projects, formatKRW, loadData, setActiveTab, embedded, executeAction }) {
            const hosted = isGasHosted();
            const [mons, setMons] = useState([]);
            const [busy, setBusy] = useState(false);
            const [msg, setMsg] = useState('');
            const [reviewers, setReviewers] = useState({}); // bidNo -> 최종검토자 입력값
            const [approving, setApproving] = useState('');
            const [detail, setDetail] = useState(null);   // 클릭한 건(요약/메모 팝업)
            const [memo, setMemo] = useState('');
            const [memoBusy, setMemoBusy] = useState(false);
            const [pdetail, setPdetail] = useState(null); // 제안 진행 중 카드 팝업(편집)
            const [psaving, setPsaving] = useState(false);
            // 비고에서 '[모니터링 자동등록] 공고번호 …' 시스템 토큰을 분리(공고번호 매칭에 쓰여 보존 필요)
            const SYS_RE = /\[모니터링 자동등록\][^\n]*/;
            const stripSys = (note) => String(note || '').replace(/\[모니터링 자동등록\][^\n]*\n?/, '').replace(/^\n+/, '').trim();
            const openProject = (p) => {
                const note = String(p.note || '');
                const m = note.match(SYS_RE);
                setPdetail({ ...p, _sysTok: m ? m[0] : '', _memo: stripSys(note) });
            };
            const pField = (k, v) => setPdetail(d => ({ ...d, [k]: v }));
            const saveProject = async () => {
                if (!pdetail) return;
                // 시스템 토큰 + 사용자 메모 재결합 → note 보존
                const note = pdetail._sysTok ? (pdetail._sysTok + (pdetail._memo ? '\n' + pdetail._memo : '')) : (pdetail._memo || '');
                setPsaving(true); setMsg('제안 사업 저장 중…');
                try {
                    await executeAction('updateProject', { ...pdetail, note: note, rowIndex: pdetail.rowIndex });
                    setMsg('제안 사업이 수정되었습니다.');
                    setPdetail(null);
                    if (loadData) await loadData();
                } catch (e) { setMsg('수정 실패: ' + ((e && e.message) || e)); }
                setPsaving(false);
            };
            const openDetail = (m) => { setDetail(m); setMemo(splitMemo(m['메모']).human); };
            const saveMemo = async () => {
                if (!detail) return;
                setMemoBusy(true);
                try {
                    const reportRaw = splitMemo(detail['메모']).reportRaw; // AI 블록 보존
                    const merged = joinMemo(memo, reportRaw);
                    await gasRun('apiUpdateMonitoring', { bidNo: detail['공고번호'], memo: merged });
                    setMons(list => { const next = list.map(x => x['공고번호'] === detail['공고번호'] ? { ...x, '메모': merged } : x); window.__pendingCache = next; return next; });
                    setDetail(d => ({ ...d, '메모': merged }));
                    setMsg('메모가 저장되었습니다.');
                } catch (e) { setMsg('메모 저장 실패: ' + ((e && e.message) || e)); }
                setMemoBusy(false);
            };

            const loadMon = async (force) => {
                if (!hosted) return;
                if (!force && Array.isArray(window.__pendingCache)) { setMons(window.__pendingCache); return; } // 캐시 우선
                setBusy(true); setMsg('결정 대기 불러오는 중…');
                try {
                    const list = await gasRun('apiReadPendingDecisions');
                    const arr = Array.isArray(list) ? list : [];
                    window.__pendingCache = arr; setMons(arr); setMsg('');
                } catch (e) { setMsg('결정 대기 로드 실패: ' + ((e && e.message) || e)); }
                setBusy(false);
            };
            useEffect(() => { loadMon(false); }, []);

            // 마감 D-day 계산
            const dday = (s) => {
                const m = String(s || '').match(/(\d{4})[.\-\s]+(\d{1,2})[.\-\s]+(\d{1,2})/);
                if (!m) return null;
                const due = new Date(+m[1], +m[2] - 1, +m[3]);
                const today = new Date(); today.setHours(0, 0, 0, 0);
                return Math.round((due - today) / 86400000);
            };
            const ddText = (d) => d === null ? '' : d < 0 ? `마감 지남` : d === 0 ? 'D-DAY' : `D-${d}`;
            const ddColor = (d) => d === null ? 'text-slate-400' : d <= 3 ? 'text-rose-600' : d <= 7 ? 'text-amber-600' : 'text-slate-500';

            // ① 결정 대기: 슬림 API가 '1차 검토 완료'만 반환 → 그대로 사용
            const pending = useMemo(() => mons
                .map(m => ({ ...m, _d: dday(m['마감일']) }))
                .sort((a, b) => (a._d === null) - (b._d === null) || (a._d ?? 9999) - (b._d ?? 9999)), [mons]);

            // ② 제안 진행 중: 단계 ∈ {제안 중, 결과 대기}. D-day·우선순위·발표경과 계산 후 우선순위 내림차순(발표 지난 건 최하).
            const inProgress = useMemo(() => (projects || [])
                .filter(p => ['제안 중', '결과 대기'].includes(normalizeStage(p.stage)))
                .map(p => {
                    const dueD = dday(p.dueDate);
                    const prD = dday(p.presentDate);
                    const presentPassed = prD !== null && prD < 0;
                    const eff = presentPassed ? -1 : (Number(p.priority) || 2); // 발표 지나면 우선순위 최하
                    return { ...p, _due: dueD, _present: prD, _presentPassed: presentPassed, _eff: eff };
                })
                .sort((a, b) => b._eff - a._eff || (a._due ?? 9999) - (b._due ?? 9999)), [projects]);

            // 발표일 경과 + 단계='제안 중' → '결과 대기'로 자동 전환(화면 열 때 즉시). 중복 실행 방지 가드.
            const flipBusy = useRef(false);
            useEffect(() => {
                if (flipBusy.current || !executeAction) return;
                const toFlip = (projects || []).filter(p => normalizeStage(p.stage) === '제안 중' && (() => { const d = dday(p.presentDate); return d !== null && d < 0; })());
                if (!toFlip.length) return;
                flipBusy.current = true;
                (async () => {
                    for (const p of toFlip) { try { await executeAction('updateProject', { ...p, stage: '결과 대기', rowIndex: p.rowIndex }); } catch (e) { } }
                    if (loadData) await loadData();
                    flipBusy.current = false;
                })();
            }, [projects]);

            // 우선순위 변경
            const setPriority = async (p, val) => {
                try { await executeAction('updateProject', { ...p, priority: val, rowIndex: p.rowIndex }); if (loadData) await loadData(); }
                catch (e) { setMsg('우선순위 저장 실패: ' + ((e && e.message) || e)); }
            };
            const [progView, setProgView] = useState('list'); // list | calendar

            const [simModal, setSimModal] = useState(null); // {m, rf, candidates}
            const runApprove = async (m, rf, linkRowIndex) => {
                const bidNo = m['공고번호'] || '';
                setSimModal(null); setApproving(bidNo); setMsg('승인 처리 중…');
                try {
                    const payload = { name: m['사업명'], bidNo: bidNo, client: m['발주처'], budget: m['예산'], folderUrl: m['첨부폴더'], reviewerFinal: rf, dueDate: m['마감일'] || '' };
                    if (linkRowIndex) payload.linkRowIndex = linkRowIndex;
                    const r = await gasRun('apiApproveToProposal', payload);
                    setMsg((r && r.message) || '승인 완료');
                    await loadMon(true);
                    if (loadData) await loadData();
                    setDetail(d => (d && (d['공고번호'] || d['사업명']) === bidNo) ? null : d); // 패널 열려있었으면 닫기
                } catch (e) { setMsg('승인 실패: ' + ((e && e.message) || e)); }
                setApproving('');
            };
            const approve = async (m) => {
                const bidNo = m['공고번호'] || '';
                const rf = (reviewers[bidNo] || '').trim();
                if (!rf) { setMsg('최종 검토자를 입력하세요.'); return; }
                setApproving(bidNo); setMsg('유사 진행 건 확인 중…');
                let cands = [];
                try { cands = await gasRun('apiCheckSimilarProposal', m['사업명'], m['발주처']) || []; } catch (e) { /* 조회 실패 시 신규로 */ }
                setApproving('');
                if (cands.length) { setSimModal({ m, rf, candidates: cands }); return; } // 후보 있으면 선택 모달
                if (!confirm(`'${m['사업명']}'\n최종 검토자: ${rf}\n승인하면 제안 진행 중(단독·구름100%)으로 등록됩니다. 진행할까요?`)) return;
                runApprove(m, rf, 0);
            };
            const dropPending = async (m) => {
                const bidNo = m['공고번호'] || '';
                const reason = prompt(`'${m['사업명']}' 드랍 사유를 입력하세요`, '');
                if (reason === null) return; // 취소
                setApproving(bidNo); setMsg('드랍 처리 중…');
                try {
                    await gasRun('apiDropMonitoring', bidNo, reason);
                    setMsg('드랍 처리되었습니다.');
                    await loadMon(true);
                    setDetail(d => (d && (d['공고번호'] || d['사업명']) === bidNo) ? null : d); // 패널 열려있었으면 닫기
                } catch (e) { setMsg('드랍 실패: ' + ((e && e.message) || e)); }
                setApproving('');
            };

            if (!hosted) return <div className="p-8 text-sm text-slate-500">이 화면은 배포(웹앱) 환경에서 동작합니다.</div>;

            return (
                <div className={embedded ? 'space-y-6' : 'space-y-6 animate-fadeIn'}>
                    {!embedded && (
                        <div className="flex items-center justify-between flex-wrap gap-2">
                            <div>
                                <h2 className="text-xl font-extrabold text-slate-900">진행 중 제안</h2>
                                <p className="text-sm text-slate-500">제안 결정 대기 <b className="text-rose-600">{pending.length}</b> · 제안 진행 중 <b className="text-brand-600">{inProgress.length}</b></p>
                            </div>
                            {msg && <span className="text-xs text-slate-500">{msg}</span>}
                        </div>
                    )}
                    {embedded && msg && <div className="text-xs text-slate-600 bg-slate-50 border border-slate-200 rounded-lg px-3 py-2">{msg}</div>}

                    {/* ② 제안 진행 중 (결정 대기보다 위) */}
                    <div className="bg-white border border-slate-200 rounded-2xl p-5">
                        <div className="flex items-center justify-between mb-3 gap-2">
                            <p className="text-sm font-bold text-slate-700">🔵 제안 진행 중 <span className="font-normal text-slate-400">(우선순위순 · 발표일 경과 시 결과 대기로 전환)</span></p>
                            <div className="flex rounded-lg border border-slate-200 overflow-hidden shrink-0">
                                <button onClick={() => setProgView('list')} className={`px-2.5 py-1 text-[11px] font-bold ${progView === 'list' ? 'bg-brand-600 text-white' : 'bg-white text-slate-500'}`}>목록</button>
                                <button onClick={() => setProgView('calendar')} className={`px-2.5 py-1 text-[11px] font-bold ${progView === 'calendar' ? 'bg-brand-600 text-white' : 'bg-white text-slate-500'}`}>캘린더</button>
                            </div>
                        </div>
                        {inProgress.length === 0 ? (
                            <p className="text-sm text-slate-400 py-4 text-center">제안 진행 중인 사업이 없습니다.</p>
                        ) : progView === 'calendar' ? (
                            <ProposalCalendar items={inProgress} formatKRW={formatKRW} onPick={openProject} />
                        ) : (
                            <div className="space-y-2">
                                {inProgress.map((p, i) => (
                                    <div key={i} className="border border-slate-200 rounded-xl p-3 hover:border-brand-300 transition-colors">
                                        <div className="flex items-start justify-between gap-3">
                                            <div className="min-w-0 flex-1 cursor-pointer" onClick={() => openProject(p)} title="상세·수정">
                                                <div className="flex items-center gap-2 flex-wrap">
                                                    <span className="text-[11px] font-bold text-brand-600">{normalizeStage(p.stage)}</span>
                                                    {p.dueDate
                                                        ? <span className={`text-[11px] font-bold ${ddColor(p._due)}`}>{ddText(p._due)}</span>
                                                        : <span className="text-[11px] font-bold text-slate-400">본 공고 대기 중</span>}
                                                    <span className="font-bold text-slate-800 truncate">{p.name}</span>
                                                    {stripSys(p.note) && <span className="text-[10px] text-brand-500">📝</span>}
