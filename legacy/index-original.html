        // ==========================================
        // 8.5 제안 모니터링 화면 (Monitor.gs 연동)
        // ==========================================
        function MonitoringManagement({ formatKRW, loadData, mode, projects, executeAction }) {
            const hosted = isGasHosted();
            const [sub, setSub] = useState('progress');  // progress | list | config | dash (기본: 진행 중 건)
            const [items, setItems] = useState([]);
            const sort = useSortable('수집일', 'desc');
            const [cfg, setCfg] = useState(null);
            const [busy, setBusy] = useState(false);
            const [msg, setMsg] = useState('');
            const [statusFilter, setStatusFilter] = useState(['사전규격', '공고예정(수기입력)', '공고 감지', '1차 검토 완료', '최종 검토 완료']); // 기본: 제외 숨김
            const [trigStatus, setTrigStatus] = useState(null);
            const [nextRunText, setNextRunText] = useState('');
            const [showAdd, setShowAdd] = useState(false);
            const [form, setForm] = useState({});
            const [showNextRun, setShowNextRun] = useState(false);
            const [llmStats, setLlmStats] = useState(null);
            const [editRow, setEditRow] = useState(null); // 내용 수정 모달 대상
            const [dailyAgg, setDailyAgg] = useState(null); // 서버 일자별 집계(활성+보관)
            const [slideItem, setSlideItem] = useState(null); // 요약/보고서 사이드 패널
            const [regenBusy, setRegenBusy] = useState(false);
            const [regenMsg, setRegenMsg] = useState('');
            const regenReport = async () => {
                if (!slideItem) return;
                setRegenBusy(true); setRegenMsg('보고서 생성 중… (30초~1분 소요)');
                try {
                    const r = await gasRun('apiRegenReport', slideItem['공고번호'] || '', slideItem['사업명'] || '');
                    if (r && r.ok) {
                        setRegenMsg('✅ ' + r.msg);
                        const newMemo = r.memo || '';
                        setItems(list => list.map(x => x['공고번호'] === slideItem['공고번호'] ? { ...x, '메모': newMemo } : x));
                        setSlideItem(s => ({ ...s, '메모': newMemo }));
                    } else { setRegenMsg('❌ ' + ((r && r.msg) || '생성 실패')); }
                } catch (e) { setRegenMsg('❌ ' + ((e && e.message) || e)); }
                setRegenBusy(false);
            };

            const STATUSES = ['사전규격', '공고예정(수기입력)', '공고 감지', '1차 검토 완료', '최종 검토 완료'];

            // 일자별 모니터링 건수 / 제안 진행 건수 (판정='작업 진행' = 제안 등록됨)
            const dashStats = useMemo(() => {
                // 서버 집계(활성+보관 합산)가 있으면 우선 사용 → 보관해도 수집 수 유지
                if (dailyAgg && dailyAgg.rows) {
                    const maxTotal = dailyAgg.rows.reduce((m, r) => Math.max(m, r.total), 1);
                    return { rows: dailyAgg.rows, total: dailyAgg.total, proposed: dailyAgg.proposed, rate: dailyAgg.rate, maxTotal };
                }
                const map = {};
                items.forEach(r => {
                    const d = String(r['수집일'] || '').slice(0, 10) || '(미상)';
                    if (!map[d]) map[d] = { date: d, total: 0, proposed: 0 };
                    map[d].total++;
                    if (r['판정'] === '작업 진행') map[d].proposed++;
                });
                const rows = Object.values(map).sort((a, b) => String(b.date).localeCompare(String(a.date)));
                const total = items.length;
                const proposed = items.filter(r => r['판정'] === '작업 진행').length;
                const maxTotal = rows.reduce((m, r) => Math.max(m, r.total), 1);
                return { rows, total, proposed, rate: total ? Math.round(proposed / total * 100) : 0, maxTotal };
            }, [items, dailyAgg]);
            const ALL_STATUSES = [...STATUSES, '제외'];
            // 레거시 상태값 → 새 5단계로 매핑
            const normStatus = (s) => {
                const v = (s || '').trim();
                if (STATUSES.includes(v) || v === '제외') return v;
                if (v === '제외' || v === '드랍') return '제외';
                if (v === '검토완료' || v === '작업중' || v === '작업 중') return '1차 검토 완료';
                if (v === '신규' || v === '검토전' || v === '') return '공고 감지';
                if (v === '조건 부합') return '공고 감지'; // 레거시 명칭 호환
                return v;
            };
            const toggleStatusFilter = (s) => setStatusFilter(f => f.includes(s) ? f.filter(x => x !== s) : [...f, s]);
            const setStatus = async (row, status) => {
                try { await gasRun('apiSetMonitorStatus', row['공고번호'], status); setItems(prev => prev.map(r => r['공고번호'] === row['공고번호'] ? { ...r, ['상태']: status } : r)); }
                catch (e) { setMsg('상태 변경 실패: ' + ((e && e.message) || e)); }
            };

            const reload = async () => {
                if (!hosted) return;
                setBusy(true);
                try {
                    const list = await gasRun('apiReadMonitoring');
                    const norm = (list || []).map(row => {
                        const o = { ...row };
                        for (const k in o) { if (o[k] instanceof Date) o[k] = o[k].toISOString().slice(0, 16).replace('T', ' ').replace(/ 00:00$/, ''); }
                        return o;
                    });
                    setItems(norm); setMsg('목록 ' + norm.length + '건 로드됨');
                    try { setDailyAgg(await gasRun('apiMonitoringDailyStats')); } catch (e) { /* 집계 실패 시 items로 폴백 */ }
                } catch (e) { setMsg('목록 로드 실패: ' + ((e && e.message) || e)); }
                setBusy(false);
            };
            const loadCfg = async () => {
                if (!hosted) return;
                try { setCfg(await gasRun('apiGetMonitorConfig')); }
                catch (e) { setMsg('설정 로드 실패: ' + ((e && e.message) || e)); }
            };
            const loadTrig = async () => {
                if (!hosted) return;
                try { setTrigStatus(await gasRun('apiGetMonitorTriggerStatus')); } catch (e) { /* 무시 */ }
            };
            const loadLlmStats = async () => {
                if (!hosted) return;
                try { setLlmStats(await gasRun('apiGetLlmStats')); } catch (e) { /* 무시 */ }
            };
            const resetLlmStats = async () => {
                if (!confirm('LLM 호출량 집계를 0으로 초기화할까요?')) return;
                try { setLlmStats(await gasRun('apiResetLlmStats')); setMsg('호출량 집계를 초기화했습니다.'); } catch (e) { setMsg('초기화 실패: ' + ((e && e.message) || e)); }
            };
            useEffect(() => { reload(); loadCfg(); loadTrig(); loadLlmStats(); }, []);

            const fmtRemain = (s) => {
                if (s == null) return '';
                const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
                return `${h}시간 ${m}분 ${sec}초`;
            };
            const archiveExcluded = async () => {
                if (!confirm("제외/드랍된 항목을 '모니터링 보관' 시트로 옮깁니다. (활성 목록이 가벼워져 로딩이 빨라집니다) 진행할까요?")) return;
                setBusy(true); setMsg('제외/드랍 항목 보관 중…');
                try { const r = await gasRun('apiArchiveMonitoring'); setMsg(r || '보관 완료'); await reload(); }
                catch (e) { setMsg('보관 실패: ' + ((e && e.message) || e)); }
                setBusy(false);
            };
            const checkNextRun = async () => {
                try {
                    const st = await gasRun('apiGetMonitorTriggerStatus');
                    setTrigStatus(st);
                    setNextRunText(st.enabled ? `다음 수집까지 ${fmtRemain(st.secondsRemaining)} (매일 ${st.hour}시)` : '트리거가 꺼져 있습니다. ⏰ 트리거를 먼저 켜주세요.');
                } catch (e) { setNextRunText('확인 실패: ' + ((e && e.message) || e)); }
                setShowNextRun(true);
            };
            const submitManual = async () => {
                if (!(form.name || '').trim()) { setMsg('사업명을 입력하세요.'); return; }
                setBusy(true);
                try { const r = await gasRun('apiAddManualMonitoring', form); setMsg((r && r.message) || '추가됨'); setShowAdd(false); setForm({}); await reload(); }
                catch (e) { setMsg('추가 실패: ' + ((e && e.message) || e)); }
                setBusy(false);
            };
            const bulkDownload = async () => {
                const shown = items.filter(r => statusFilter.includes(normStatus(r['상태'])));
                const bidNos = shown.map(r => r['공고번호']).filter(Boolean);
                if (!bidNos.length) { setMsg('필터에 걸린 사업이 없습니다.'); return; }
                setBusy(true); setMsg(`${bidNos.length}건의 공고 첨부를 압축 중… (잠시 걸릴 수 있어요)`);
                try {
                    const r = await gasRun('apiBulkDownloadAttachments', bidNos);
                    if (r && r.url) {
                        let m = `${r.fileCount}개 파일(${r.sizeMB}MB) 압축 완료. 다운로드를 시작합니다.`;
                        if (r.skipped) m += ` 용량 초과로 ${r.skipped}개 제외.`;
                        if (r.noAttach) m += ` 첨부 없는 ${r.noAttach}건 제외.`;
                        setMsg(m); window.open(r.url, '_blank');
                    } else setMsg((r && r.message) || '다운로드할 첨부가 없습니다.');
                } catch (e) { setMsg('일괄 다운로드 실패: ' + ((e && e.message) || e)); }
                setBusy(false);
            };

            const runNow = async () => {
                setBusy(true); setMsg('수집 시작...');
                let polling = true;
                const poll = async () => {
                    while (polling) {
                        try {
                            const p = await gasRun('apiGetMonitorProgress');
                            if (polling && p && p.label) {
                                setMsg(`(${p.n}/${p.N}단계) ${p.pct}% · ${p.label}${p.detail ? ' — ' + p.detail : ''}`);
                            }
                        } catch (e) { /* 폴링 실패는 무시 */ }
                        await new Promise(r => setTimeout(r, 1200));
                    }
                };
                poll();
                try { const r = await gasRun('apiRunMonitorNow'); polling = false; setMsg(r); await reload(); }
                catch (e) { polling = false; setMsg('실행 실패: ' + ((e && e.message) || e)); }
                setBusy(false);
            };
            const startWork = async (row) => {
                if (!confirm(`'${row['사업명']}' 건을 '전체 사업'에 제안 중으로 등록할까요?`)) return;
                setBusy(true);
                try {
                    await gasRun('apiStartWork', { name: row['사업명'], client: row['발주처'], bidNo: row['공고번호'], type: 'B2G', folderUrl: row['첨부폴더'] || '', budget: row['예산'] || '' });
                    window.__pendingCache = null; // 결정 대기 목록 변경 → 캐시 무효화
                    setMsg('제안 중으로 등록되었습니다.'); await reload(); await loadData();
                } catch (e) { setMsg('등록 실패: ' + ((e && e.message) || e)); }
                setBusy(false);
            };
            const exclude = async (row) => {
                const reason = prompt(`'${row['사업명']}' 드랍 사유를 입력하세요`, '');
                if (reason === null) return; // 취소
                setBusy(true);
                try { await gasRun('apiDropMonitoring', row['공고번호'], reason); setMsg('드랍 처리되었습니다.'); await reload(); }
                catch (e) { setMsg('실패: ' + ((e && e.message) || e)); }
                setBusy(false);
            };

            // 슬랙 카드 형식 텍스트 생성(붙여넣기용: *볼드*는 슬랙이 자동 변환, 링크는 일반 URL)
            const [copiedNo, setCopiedNo] = useState('');
            const ddayParts = (closeDt) => {
                const m = String(closeDt || '').match(/(\d{4})[.\-\/]\s*(\d{1,2})[.\-\/]\s*(\d{1,2})/);
                if (!m) return { date: '', label: '' };
                const d = new Date(+m[1], +m[2] - 1, +m[3]); const t = new Date();
                d.setHours(0, 0, 0, 0); t.setHours(0, 0, 0, 0);
                const n = Math.round((d - t) / 86400000);
                return { date: `${m[1]}-${('0' + m[2]).slice(-2)}-${('0' + m[3]).slice(-2)}`, label: n < 0 ? '마감' : (n === 0 ? 'D-DAY' : 'D-' + n) };
            };
            const wonComma = (v) => {
                const n = typeof v === 'number' ? v : parseFloat(String(v == null ? '' : v).replace(/[^\d.-]/g, ''));
                if (isNaN(n) || n <= 0) return '';
                return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ',') + '원';
            };
            // AI 보고서(JSON) → 슬랙 공유용 텍스트
            const reportToSlack = (row, r) => {
                if (!r) return '';
                const gradeEmoji = r.grade === '상' ? '🟢' : r.grade === '하' ? '🔴' : '🟡';
                const qualEmoji = r.qualification === '자격 충족' ? '✅' : r.qualification === '자격 미달' ? '❌' : '⚠️';
                const lines = [];
                lines.push('*' + (row['사업명'] || r.taskSummary || '') + '*');
                lines.push('');
                lines.push(gradeEmoji + ' *종합 등급: ' + (r.grade || '-') + '*   ' + qualEmoji + ' *자격 판정: ' + (r.qualification || '-') + '*');
                if (r.qualReason) lines.push('   ↳ ' + r.qualReason);
                lines.push('');
                lines.push('📋 *사업 개요*');
                if (r.agency) lines.push('  🏛 발주/수요: ' + r.agency);
                if (r.budget) lines.push('  💰 예산: ' + r.budget);
                if (r.period) lines.push('  📅 사업기간: ' + r.period);
                if (r.bidPeriod) lines.push('  ⏰ 투찰기간: ' + r.bidPeriod);
                if (r.bidNo) lines.push('  🔢 공고번호: ' + r.bidNo);
                lines.push('');
                lines.push('📝 *입찰 조건*');
                if (r.contractType) lines.push('  • 계약방법: ' + r.contractType);
                if (r.consortium) lines.push('  • 공동수급: ' + r.consortium);
                if (r.evalWeight) lines.push('  • 평가배점: ' + r.evalWeight);
                if (r.cutoff) lines.push('  • 과락기준: ' + r.cutoff);
                if (r.submitSpec) lines.push('  • 제출규격: ' + r.submitSpec);
                if (r.tasks && r.tasks.length) { lines.push(''); lines.push('🔧 *핵심 과업*'); r.tasks.forEach(t => lines.push('  • ' + t)); }
                if (r.docs && r.docs.length) { lines.push(''); lines.push('📎 *자격 및 제출 서류*'); r.docs.forEach(d => lines.push('  • ' + d)); }
                if (r.pros && r.pros.length) { lines.push(''); lines.push('👍 *긍정 요인*'); r.pros.forEach(p => lines.push('  + ' + p)); }
                if (r.risks && r.risks.length) { lines.push(''); lines.push('⚠️ *리스크*'); r.risks.forEach(r2 => lines.push('  - ' + r2)); }
                if (row['공고URL']) { lines.push(''); lines.push('🔗 공고 원문: ' + row['공고URL']); }
                if (row['첨부폴더']) lines.push('📁 폴더: ' + row['첨부폴더']);
                return lines.join('\n');
            };

            const buildCardText = (row) => {
                const title = row['사업명'] || '(제목없음)';
                const spec = String(row['소스'] || '').includes('사전규격') || String(row['상태'] || '').includes('사전규격');
                const org = (row['수요기관'] && String(row['수요기관']).trim()) ? row['수요기관'] : (row['발주처'] || '');
                const { date, label } = ddayParts(row['마감일']);
                const lines = [];
                lines.push('*' + title + '*' + (spec ? '  📄 사전규격' : ''));
                if (org) lines.push('🏛 ' + org);
                if (date) lines.push('📅 마감 ' + date + (label ? ' (' + label + ')' : ''));
                else lines.push('📅 마감일 미정' + (spec ? ' (사전규격)' : ''));
                const b = wonComma(row['예산']); if (b) lines.push('💰 ' + b);
                if (row['요약']) lines.push('📝 ' + row['요약']);
                if (row['공고URL']) lines.push('🔗 공고: ' + row['공고URL']);
                if (row['첨부폴더']) lines.push('📁 공고문 폴더: ' + row['첨부폴더']);
                return lines.join('\n');
            };
            const copyCard = async (row) => {
                const text = buildCardText(row);
                try {
                    if (navigator.clipboard && navigator.clipboard.writeText) {
                        await navigator.clipboard.writeText(text);
                    } else {
                        const ta = document.createElement('textarea');
                        ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
                        document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
                    }
                    setCopiedNo(row['공고번호']); setTimeout(() => setCopiedNo(''), 1500);
                } catch (e) {
                    // 클립보드 차단 환경: 프롬프트로 수동 복사
                    window.prompt('아래 내용을 복사하세요 (Ctrl/Cmd+C)', text);
                }
            };
            const submitEdit = async () => {
                if (!editRow || !(editRow.name || '').trim()) { setMsg('사업명을 입력하세요.'); return; }
                setBusy(true);
                try {
                    await gasRun('apiUpdateMonitoring', {
                        bidNo: editRow.bidNo, name: editRow.name, client: editRow.client, demand: editRow.demand,
                        closeDt: editRow.closeDt, budget: editRow.budget, summary: editRow.summary, url: editRow.url, solution: editRow.solution,
                        reviewer1: editRow.reviewer1, reviewerFinal: editRow.reviewerFinal
                    });
                    setMsg('수정되었습니다.'); setEditRow(null); await reload();
                } catch (e) { setMsg('수정 실패: ' + ((e && e.message) || e)); }
                setBusy(false);
            };
            const openEdit = (row) => setEditRow({
                bidNo: row['공고번호'], name: row['사업명'] || '', client: row['발주처'] || '', demand: row['수요기관'] || '',
                closeDt: row['마감일'] || '', budget: row['예산'] || '', summary: row['요약'] || '', url: row['공고URL'] || '', solution: row['매칭솔루션'] || '',
                reviewer1: row['1차검토자'] || '', reviewerFinal: row['최종검토자'] || ''
            });
            const saveCfg = async () => {
                setBusy(true); setMsg('저장 중...');
                try { const r = await gasRun('apiSaveMonitorConfig', cfg); setMsg(r); await loadCfg(); }
                catch (e) { setMsg('저장 실패: ' + ((e && e.message) || e)); }
                setBusy(false);
            };
            const trig = async (on) => {
                try { const r = await gasRun(on ? 'apiSetupMonitorTrigger' : 'apiRemoveMonitorTrigger'); setMsg(r); await loadTrig(); if (!on) setNextRunText(''); }
                catch (e) { setMsg('실패: ' + ((e && e.message) || e)); }
            };
            const [digestOn, setDigestOn] = useState(null);
            const loadDigest = async () => { try { const s = await gasRun('apiGetDigestTriggerStatus'); setDigestOn(s); } catch (e) {} };
            useEffect(() => { loadDigest(); }, []);
            const digestTrig = async (on) => {
                try { const r = await gasRun(on ? 'apiSetupDigestTrigger' : 'apiRemoveDigestTrigger'); setMsg(r); await loadDigest(); }
                catch (e) { setMsg('실패: ' + ((e && e.message) || e)); }
            };
            const digestNow = async () => {
                setMsg('다이제스트 전송 중...');
                try { const r = await gasRun('apiSendDigestNow'); setMsg(r); }
                catch (e) { setMsg('전송 실패: ' + ((e && e.message) || e)); }
            };

            const statusColor = (s) => ({
                '사전규격': 'bg-violet-50 text-violet-700 border-violet-200',
                '공고예정(수기입력)': 'bg-sky-50 text-sky-700 border-sky-200',
                '공고 감지': 'bg-amber-50 text-amber-700 border-amber-200',
                '1차 검토 완료': 'bg-blue-50 text-blue-700 border-blue-200',
                '최종 검토 완료': 'bg-emerald-50 text-emerald-700 border-emerald-200',
                '제외': 'bg-slate-100 text-slate-400 border-slate-200'
            }[s] || 'bg-slate-50 text-slate-600 border-slate-200');

            const verdictBadge = (v) => ({
                '적합': 'bg-emerald-500/10 text-emerald-600 border-emerald-500/20',
                '애매': 'bg-amber-500/10 text-amber-600 border-amber-500/20',
                '검토필요': 'bg-amber-500/10 text-amber-600 border-amber-500/20',
                '작업 진행': 'bg-blue-500/10 text-blue-600 border-blue-500/20',
                '드랍': 'bg-rose-500/10 text-rose-600 border-rose-500/20',
                '제외': 'bg-slate-100 text-slate-500 border-slate-200'
            }[v] || 'bg-slate-100 text-slate-500');
            // 구 판정값 '검토필요'는 화면에 '애매'로 표시
            const verdictLabel = (v) => (v === '검토필요' ? '애매' : v);

            if (!hosted) {
                return (
                    <div className="p-8 bg-amber-500/10 border border-amber-500/20 text-amber-700 rounded-2xl text-sm leading-relaxed">
                        제안 모니터링은 <strong>구글 시트 연동 모드</strong>에서만 동작합니다.
                        배포된 웹앱(<code>/exec</code>) 주소로 접속해 사용하세요. (Mock 데모 모드에서는 비활성화됩니다.)
                    </div>
                );
            }

            // 설정 입력 헬퍼
            const field = (key, label, opt = {}) => (
                <div>
                    <label className="block text-xs text-slate-500 font-bold mb-1.5">{label}
                        {opt.secret && cfg[key + '_set'] && <span className="ml-1 text-[10px] text-emerald-600">(설정됨)</span>}
                    </label>
                    <input
                        type={opt.secret ? 'password' : 'text'}
                        placeholder={opt.ph || (opt.secret && cfg[key + '_set'] ? '변경 시에만 입력' : '')}
                        value={cfg[key] || ''}
                        onChange={(e) => setCfg({ ...cfg, [key]: e.target.value })}
                        className="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-sm text-slate-900 focus:outline-none focus:border-brand-500"
                    />
                </div>
            );
            const selectField = (key, label, options) => (
                <div>
                    <label className="block text-xs text-slate-500 font-bold mb-1.5">{label}</label>
                    <select value={cfg[key] || options[0][0]} onChange={(e) => setCfg({ ...cfg, [key]: e.target.value })}
                        className="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-sm text-slate-900 focus:outline-none focus:border-brand-500">
                        {options.map(([v, l]) => <option key={v} value={v}>{l}</option>)}
                    </select>
                </div>
            );
            const toggle = (key, label) => (
                <label className="flex items-center space-x-2 text-xs font-semibold text-slate-600">
                    <input type="checkbox" checked={cfg[key] === 'true'} onChange={(e) => setCfg({ ...cfg, [key]: e.target.checked ? 'true' : 'false' })} />
                    <span>{label}</span>
                </label>
            );
            const area = (key, label) => (
                <div>
                    <label className="block text-xs text-slate-500 font-bold mb-1.5">{label} <span className="text-[10px] text-slate-400">(줄바꿈 또는 쉼표로 구분)</span></label>
                    <textarea rows="4" value={cfg[key] || ''} onChange={(e) => setCfg({ ...cfg, [key]: e.target.value })}
                        className="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-xs text-slate-900 focus:outline-none focus:border-brand-500" />
                </div>
            );

            return (
                <div className="space-y-6 animate-fadeIn">
                    {/* 오른쪽 슬라이드 패널 — 요약/보고서 열람(수집 목록) */}
                    <div className={`fixed top-0 right-0 h-full w-full max-w-2xl bg-white shadow-2xl z-50 flex flex-col transition-transform duration-300 ${slideItem ? 'translate-x-0' : 'translate-x-full'}`}>
                        {slideItem && (() => {
                            const rep = splitMemo(slideItem['메모']).report;
                            return <>
                                <div className="flex items-start justify-between gap-3 p-5 border-b border-slate-100 shrink-0">
                                    <div className="min-w-0">
                                        <div className="flex items-center gap-2 flex-wrap">
                                            <span className={`text-[11px] font-bold px-2 py-0.5 rounded-full ${slideItem['판정'] === '적합' ? 'bg-emerald-100 text-emerald-700' : slideItem['판정'] === '제외' ? 'bg-rose-100 text-rose-700' : 'bg-amber-100 text-amber-700'}`}>{verdictLabel(slideItem['판정'])}</span>
                                            <span className="text-[11px] text-slate-400">{slideItem['발주처']}</span>
                                        </div>
                                        <h3 className="text-sm font-extrabold text-slate-900 mt-1 leading-snug">{slideItem['사업명']}</h3>
                                    </div>
                                    <div className="flex items-center gap-1 shrink-0">
                                        {splitMemo(slideItem['메모']).report
                                            ? <button onClick={async () => { const txt = reportToSlack(slideItem, splitMemo(slideItem['메모']).report); await navigator.clipboard.writeText(txt); setCopiedNo(slideItem['공고번호']); setTimeout(() => setCopiedNo(''), 2000); }} className={`px-2 py-1 rounded text-[10px] font-bold ${copiedNo === slideItem['공고번호'] ? 'bg-emerald-500 text-white' : 'bg-emerald-50 text-emerald-700'}`} title="슬랙 공유용 보고서 복사">
                                                {copiedNo === slideItem['공고번호'] ? '✓ 복사됨' : '📋 보고서 복사'}
                                            </button>
                                            : <button onClick={() => copyCard(slideItem)} className={`px-2 py-1 rounded text-[10px] font-bold ${copiedNo === slideItem['공고번호'] ? 'bg-emerald-500 text-white' : 'bg-slate-100 text-slate-500'}`} title="슬랙 카드 형식으로 복사">
                                                {copiedNo === slideItem['공고번호'] ? '✓ 복사됨' : '📋 복사'}
                                            </button>}
                                        <button onClick={() => { setSlideItem(null); setRegenMsg(''); }} className="text-slate-400 hover:text-slate-700 text-2xl leading-none px-1">×</button>
                                    </div>
                                </div>
                                <div className="flex-1 overflow-y-auto p-5 space-y-4">
                                    {/* 한줄 요약 — 보고서 유무와 무관하게 항상 맨 위에 표시 */}
                                    <div className="bg-brand-50/60 border border-brand-100 rounded-lg p-3">
                                        <p className="text-[10px] font-bold text-brand-600 mb-1">📌 한줄 요약</p>
                                        <p className="text-sm text-slate-800 leading-relaxed">{taskLine(slideItem) || slideItem['요약'] || '(요약 없음)'}</p>
                                    </div>
                                    {rep ? <ReportView r={rep} /> : (
                                        <div className="space-y-3">
                                            {(slideItem['PDF첨부'] || slideItem['원본첨부'] || slideItem['첨부폴더']) ? (
                                                <div className="bg-amber-50 border border-amber-200 rounded-lg p-3">
                                                    <p className="text-[12px] text-amber-700 font-bold mb-2">📄 상세 검토 보고서가 없습니다</p>
                                                    <p className="text-[11px] text-amber-600 mb-2">첨부 파일(제안요청서·과업지시서 우선)에서 텍스트를 추출해 보고서를 생성합니다(30초~1분 소요).</p>
                                                    <button onClick={regenReport} disabled={regenBusy} className="bg-amber-500 text-white px-3 py-1.5 rounded-lg text-xs font-bold disabled:opacity-50">
                                                        {regenBusy ? '생성 중…' : '🔄 보고서 생성'}
                                                    </button>
                                                    {regenMsg && <p className="text-[11px] mt-2 text-amber-700">{regenMsg}</p>}
                                                </div>
                                            ) : (
                                                <div className="bg-slate-50 border border-slate-200 rounded-lg p-3">
                                                    <p className="text-[12px] text-slate-500">첨부 파일이 없어 보고서를 생성할 수 없습니다.</p>
                                                </div>
                                            )}

                    </div>

                    {/* 안전 삭제 아카이브 로그 (삭제 내역 시트 미러링) */}
                    <div className="bg-white border border-slate-200 backdrop-blur-md rounded-2xl p-6">
                        <div className="mb-4">
                            <h3 className="text-lg font-bold text-slate-900 mb-1">🗑️ 안전 삭제 내역 아카이브 감사 로그</h3>
                            <p className="text-xs text-slate-400">실수로 데이터가 소실되는 것을 예방하기 위해, 데이터 삭제 요청 시 삭제 내역 시트에 백업된 내역 로그</p>
                        </div>
                        <div className="overflow-x-auto border border-slate-200 rounded-xl">
                            <table className="w-full text-left border-collapse text-xs">
                                <thead>
                                    <tr className="bg-slate-50 text-slate-500 font-bold border-b border-slate-200">
                                        <th className="p-3 w-36">삭제 일시</th>
                                        <th className="p-3 w-28">원본 시트</th>
                                        <th className="p-3 w-48">식별값(사업명/ID)</th>
                                        <th className="p-3">삭제 데이터 요약 내용</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-200">
                                    {deletedHistory.length === 0 ? (
                                        <tr>
                                            <td colSpan="4" className="p-6 text-center text-slate-400 font-semibold">아카이브된 삭제 로그가 없습니다.</td>
                                        </tr>
                                    ) : (
                                        deletedHistory.map((item, idx) => (
                                            <tr key={idx} className="hover:bg-slate-50 text-slate-600">
                                                <td className="p-3 font-semibold text-slate-500">{item.deletedAt}</td>
                                                <td className="p-3">
                                                    <span className="bg-rose-500/10 text-rose-600 border border-rose-500/20 px-2 py-0.5 rounded text-[10px] font-bold">
                                                        {item.originalSheet}
                                                    </span>
                                                </td>
                                                <td className="p-3 font-bold text-slate-700 max-w-xs truncate">{item.keyIdentifier}</td>
                                                <td className="p-3 text-slate-500">{item.summary}</td>
                                            </tr>
                                        ))
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </div>

                </div>
            );
        }

        // ReactDOM 렌더링
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
